name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        framework:
          - {laravel: '12.*', testbench: '10.*'}
          - {laravel: '13.*', testbench: '11.*'}
        stability: [prefer-stable, prefer-lowest]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd, pdo_sqlite
          coverage: none
      - run: composer update --with="laravel/framework:${{ matrix.framework.laravel }}" --with="orchestra/testbench:${{ matrix.framework.testbench }}" --with-all-dependencies --${{ matrix.stability }} --prefer-dist --no-interaction
      - run: composer test
      - run: composer dist:check
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: composer qa
      - run: composer sync-ai
      - run: php vendor/bin/boost sync --check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --prefer-dist --no-interaction
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- public/
      - run: composer workbench:prepare
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: .artifacts/browser-results/
