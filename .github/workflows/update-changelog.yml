name: Update changelog
on:
  release:
    types: [released]
permissions:
  contents: write
jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepend published release
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'))
          const current = fs.readFileSync('CHANGELOG.md', 'utf8')
          const heading = '## ' + event.release.tag_name
          if (!current.includes(heading + '\n')) {
            fs.writeFileSync('CHANGELOG.md', '# Changelog\n\n' + heading + '\n\n' + (event.release.body ?? '') + '\n\n' + current.replace(/^# Changelog\s*/, ''))
          }
          JS
      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Yayımlanan sürüm notları eklendi"
            git push
          fi
