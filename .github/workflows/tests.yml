name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        framework:
          - {laravel: '12.*', testbench: '10.*'}
          - {laravel: '13.*', testbench: '11.*'}
        stability: [prefer-stable, prefer-lowest]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd, pdo_sqlite
          coverage: none
      - run: composer update --with="laravel/framework:${{ matrix.framework.laravel }}" --with="orchestra/testbench:${{ matrix.framework.testbench }}" --with-all-dependencies --${{ matrix.stability }} --prefer-dist --no-interaction
      - run: composer test
      - run: composer dist:check
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: composer qa
      - run: composer sync-ai
      - run: php vendor/bin/boost sync --check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --prefer-dist --no-interaction
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- public/
      - run: composer workbench:prepare
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: .artifacts/browser-results/
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, gd, pdo_sqlite
          coverage: none
      - name: Build and inspect distribution
        run: |
          composer archive --format=zip --dir=.artifacts --file=baypdf-dist
          unzip -Z1 .artifacts/baypdf-dist.zip > .artifacts/archive-files.txt
          if grep -Eq '^(vendor/|node_modules/|workbench/|tests/|resources/js/|docs/|internal/|yapilacaklar/|\.|composer.lock|package-lock.json)' .artifacts/archive-files.txt; then
            echo 'Development or private files found in distribution'
            exit 1
          fi
          mkdir .artifacts/dist-install
          unzip -q .artifacts/baypdf-dist.zip -d .artifacts/dist-install
      - name: Install runtime dependencies from archive
        working-directory: .artifacts/dist-install
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-scripts
          composer check-platform-reqs --no-dev
          php -r 'require "vendor/autoload.php"; foreach (["BayPdf\\BayPdfServiceProvider", "BayPdf\\TemplateManager", "BayPdf\\PdfRenderer"] as $class) { if (!class_exists($class)) { throw new RuntimeException($class); } } foreach (["public/designer.js", "public/designer.css", "public/Vue-LICENSE.txt", "public/DejaVu-LICENSE.txt", "LICENSE", "config/baypdf.php", "resources/views/designer.blade.php"] as $file) { if (!is_file($file)) { throw new RuntimeException($file); } }'
